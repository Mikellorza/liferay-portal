components:
    schemas:
        AssetPermissionAction:
            discriminator:
                mapping:
                    ResetAssetPermissionAction: "#/components/schemas/ResetAssetPermissionAction"
                propertyName: type
            properties:
                className:
                    type: string
                classPK:
                    format: int64
                    type: integer
                type:
                    enum:
                        -   ResetAssetPermissionAction
                    type: string
        AssetStatistics:
            properties:
                approvedCount:
                    format: int64
                    readOnly: true
                    type: integer
                brokenLinksCount:
                    format: int64
                    readOnly: true
                    type: integer
                expiredCount:
                    format: int64
                    readOnly: true
                    type: integer
                expiringSoonCount:
                    format: int64
                    readOnly: true
                    type: integer
                inDraftCount:
                    format: int64
                    readOnly: true
                    type: integer
                pendingCount:
                    format: int64
                    readOnly: true
                    type: integer
                reviewDateOverdueCount:
                    format: int64
                    readOnly: true
                    type: integer
                scheduledCount:
                    format: int64
                    readOnly: true
                    type: integer
                totalCount:
                    format: int64
                    readOnly: true
                    type: integer
                upcomingReviewCount:
                    format: int64
                    readOnly: true
                    type: integer
        AssetUsage:
            properties:
                name:
                    type: string
                type:
                    type: string
                url:
                    type: string
        BrokenLinkAsset:
            properties:
                actions:
                    additionalProperties:
                        additionalProperties:
                            type: string
                        type: object
                    readOnly: true
                    type: object
                brokenLinkTitle:
                    readOnly: true
                    type: string
                brokenLinksCount:
                    format: int64
                    readOnly: true
                    type: integer
                href:
                    readOnly: true
                    type: string
                id:
                    format: int64
                    readOnly: true
                    type: integer
                objectDefinitionExternalReferenceCode:
                    readOnly: true
                    type: string
                title:
                    readOnly: true
                    type: string
        ResetAssetPermissionAction:
            allOf:
                -   $ref: "#/components/schemas/AssetPermissionAction"
        SimilarAsset:
            description:
                A CMS content asset that belongs to a similar asset set.
            properties:
                contentType:
                    description:
                        The localized label of the asset's content type.
                    readOnly: true
                    type: string
                dateModified:
                    format: date-time
                    readOnly: true
                    type: string
                id:
                    format: int64
                    readOnly: true
                    type: integer
                itemURL:
                    description:
                        The URL of the asset's edit form. Absent when the user cannot update the asset.
                    readOnly: true
                    type: string
                title:
                    readOnly: true
                    type: string
        SimilarAssetSet:
            description:
                A set of CMS content assets detected as similar to one another.
            properties:
                similarAssets:
                    description:
                        The set's assets that fall inside the requested page. A set split across pages repeats in the next page with the remaining assets.
                    items:
                        $ref: "#/components/schemas/SimilarAsset"
                    readOnly: true
                    type: array
                size:
                    description:
                        The total number of assets in the set, independent of the requested page.
                    readOnly: true
                    type: integer
                title:
                    description:
                        A name for the set, derived from what the titles of its assets have in common.
                    readOnly: true
                    type: string
info:
    license:
        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    title: ""
    version: v1.0
openapi: 3.0.1
paths:
    "/asset-permission":
        post:
            description:
                Perform an action on the asset's permissions
            operationId: postAssetPermission
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/AssetPermissionAction"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/AssetPermissionAction"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AssetPermissionAction"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/AssetPermissionAction"
            tags: ["AssetPermissionAction"]
    "/asset-statistics":
        get:
            operationId: getAssetStatistics
            parameters:
                -   in: query
                    name: assetLibraryId
                    schema:
                        format: int64
                        type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AssetStatistics"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/AssetStatistics"
            tags: ["AssetStatistics"]
    "/asset-usages/{assetId}":
        get:
            operationId: getAssetUsagesAssetPage
            parameters:
                -   in: path
                    name: assetId
                    required: true
                    schema:
                        format: int64
                        type: integer
                -   in: query
                    name: page
                    schema:
                        type: integer
                -   in: query
                    name: pageSize
                    schema:
                        type: integer
                -   in: query
                    name: search
                    schema:
                        type: string
                -   in: query
                    name: sort
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/AssetUsage"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/AssetUsage"
                                type: array
            tags: ["AssetUsage"]
    "/broken-link-assets":
        get:
            operationId: getBrokenLinkAssetsPage
            parameters:
                -   in: query
                    name: assetLibraryId
                    schema:
                        format: int64
                        type: integer
                -   in: query
                    name: page
                    schema:
                        type: integer
                -   in: query
                    name: pageSize
                    schema:
                        type: integer
                -   in: query
                    name: search
                    schema:
                        type: string
                -   in: query
                    name: sort
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/BrokenLinkAsset"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/BrokenLinkAsset"
                                type: array
            tags: ["BrokenLinkAsset"]
    "/similar-asset-sets":
        get:
            description:
                List the sets of CMS content whose main text overlaps significantly, paginated by asset. Content is compared within one language, so a translation is only ever compared against the same translation of other content, and a set always spans the whole space, so neither its size nor its name ever depends on the requested page. Omit assetLibraryId to span all accessible spaces. Note that totalCount counts the assets that belong to a set while the items are the sets that hold them, so it is the number of assets that have a similar asset rather than a page count, and a set that straddles a page boundary is returned on both pages with its full size.
            operationId: getSimilarAssetSetsPage
            parameters:
                -   in: query
                    name: assetLibraryId
                    schema:
                        format: int64
                        type: integer
                -   in: query
                    name: page
                    schema:
                        type: integer
                -   in: query
                    name: pageSize
                    schema:
                        type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/SimilarAssetSet"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/SimilarAssetSet"
                                type: array
            tags: ["SimilarAssetSet"]